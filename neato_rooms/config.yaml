name: Neato Rooms
version: "0.2.0"
slug: neato_rooms
url: https://github.com/wrcrooks/Neato-HA
description: Map your home, label rooms and clean single rooms or zones with a Neato Botvac D3–D7 (via OpenNeato)
arch:
  - aarch64
  - amd64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:robot-vacuum
panel_title: Neato Rooms
# Direct LAN access (e.g. to add the PWA to a phone's home screen) is off by default:
# anyone who can reach this port can drive the robot. Set a host port in the add-on's
# Network settings to enable it.
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Direct web UI access (optional; the sidebar panel works without it)
options:
  robot: openneato
  openneato_url: http://neato.local
  wheel_base_mm: 241
  lidar_offset_x_mm: -90
  lidar_angle_offset_deg: 0
  lidar_ccw: true
  speed_mm_s: 200
  lane_spacing_m: 0.24
schema:
  robot: list(openneato|sim)
  openneato_url: url
  wheel_base_mm: float(150,350)
  lidar_offset_x_mm: float(-200,200)
  lidar_angle_offset_deg: float(-180,180)
  lidar_ccw: bool
  speed_mm_s: int(50,300)
  lane_spacing_m: float(0.1,0.4)
  robot_radius_m: float(0.1,0.3)?
  max_step_m: float(0.1,1.0)?
  sim_time_scale: float(0,5)?
