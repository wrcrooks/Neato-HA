name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # 3.10 = minimum supported; 3.12 = what the add-on image (Alpine 3.20) ships.
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: neato_rooms/app/pyproject.toml

      - name: Install
        run: pip install -e 'neato_rooms/app[test]'

      - name: Run tests
        working-directory: neato_rooms/app
        run: pytest -v
